name: deploy
run-name: Open infrastructure PR for ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

env:
  INFRA_REPO: Gaucho-Racing/infrastructure
  KUSTOMIZATION: kubernetes/gr-foundry/manifests/workbench/kustomization.yaml

jobs:
  infra-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Workbench
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Pull infrastructure token
        id: vault
        uses: Gaucho-Racing/vault-pull-secrets@v1
        with:
          secrets: infrastructure.pr_token
      - name: Checkout infrastructure
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ fromJSON(steps.vault.outputs.secrets_json).PR_TOKEN }}
          path: infra
      - name: Resolve versions
        id: versions
        run: |
          new_tag="${{ github.event.release.tag_name }}"
          new="${new_tag#v}"
          old="$(yq '.images[] | select(.name == "ghcr.io/gaucho-racing/workbench-server") | .newTag' "infra/$KUSTOMIZATION")"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          if [ "$new" = "$old" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Bump image tags
        if: steps.versions.outputs.skip == 'false'
        env:
          NEW: ${{ steps.versions.outputs.new }}
        run: |
          awk -v new="$NEW" '
            $0 ~ "- name: ghcr.io/gaucho-racing/workbench-(server|web)$" { inworkbench=1; print; next }
            inworkbench==1 && $1=="newTag:" { sub(/newTag:[[:space:]]*.*/, "newTag: " new); inworkbench=0 }
            { print }
          ' "infra/$KUSTOMIZATION" > "infra/$KUSTOMIZATION.tmp"
          mv "infra/$KUSTOMIZATION.tmp" "infra/$KUSTOMIZATION"
          git -C infra diff -- "$KUSTOMIZATION"
      - name: Build pull request body
        if: steps.versions.outputs.skip == 'false'
        env:
          NEW_TAG: ${{ steps.versions.outputs.new_tag }}
        run: |
          {
            echo "- Bump \`workbench-server\` to \`${NEW_TAG#v}\`"
            echo "- Bump \`workbench-web\` to \`${NEW_TAG#v}\`"
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/$NEW_TAG"
          } > "$RUNNER_TEMP/pr-body.txt"
      - name: Create pull request
        if: steps.versions.outputs.skip == 'false'
        working-directory: infra
        env:
          GH_TOKEN: ${{ fromJSON(steps.vault.outputs.secrets_json).PR_TOKEN }}
          NEW: ${{ steps.versions.outputs.new }}
          NEW_TAG: ${{ steps.versions.outputs.new_tag }}
          SHORT_SHA: ${{ steps.versions.outputs.short_sha }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
        run: |
          branch="bot/bump-workbench-${NEW}"
          git config user.name "GR Admin"
          git config user.email "team@gauchoracing.com"
          git switch -C "$branch"
          git commit -am "Deploy: workbench to ${NEW_TAG} (${SHORT_SHA})"
          git push -f -u origin "$branch"
          pr="$(gh pr list --repo "$INFRA_REPO" --head "$branch" --state open --json number -q '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create --repo "$INFRA_REPO" --base main --head "$branch" --title "Deploy: workbench to ${NEW_TAG} (${SHORT_SHA})" --body-file "$RUNNER_TEMP/pr-body.txt"
            pr="$(gh pr list --repo "$INFRA_REPO" --head "$branch" --state open --json number -q '.[0].number')"
          fi
          if [ -n "$pr" ] && [ -n "$RELEASE_AUTHOR" ]; then
            gh pr edit "$pr" --repo "$INFRA_REPO" --add-reviewer "$RELEASE_AUTHOR" || true
          fi


name: workbench

services:
  kerbecs:
    container_name: workbench-kerbecs
    image: bk1031/kerbecs:3.2.0
    restart: always
    ports:
      - "127.0.0.1:10310:10310"
    volumes:
      - ./kerbecs.yaml:/etc/kerbecs/kerbecs.yaml:ro
    environment:
      KERBECS_CONFIG: /etc/kerbecs/kerbecs.yaml
    depends_on:
      - workbench
      - web

  workbench:
    container_name: workbench-server
    build:
      context: ./workbench
      dockerfile: Dockerfile.dev
    restart: always
    working_dir: /app
    ports:
      - "127.0.0.1:9999:9999"
    volumes:
      - ./workbench:/app
      - workbench_gopath:/go
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: DEV
      PORT: 9999
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: workbench
      SENTINEL_URL: ${SENTINEL_URL}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET}
      SENTINEL_REDIRECT_URI: ${SENTINEL_REDIRECT_URI}
      TARGET_ENCRYPTION_KEY: ${TARGET_ENCRYPTION_KEY}
      QUERY_TIMEOUT: 30s
      QUERY_MAX_ROWS: 5000
      QUERY_MAX_BYTES: 26214400

  web:
    container_name: workbench-web
    image: node:22-alpine
    restart: always
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:10310
      VITE_SENTINEL_URL: ${SENTINEL_URL}
      VITE_SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID}

  db:
    container_name: workbench-db
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: workbench
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  web_node_modules:
  workbench_gopath:
